[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "1.0.0"
description = "An intelligent AI agent framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.0.0",
    "pyyaml>=6.0.0",
    "mcp[cli]>=1.14.0",
    "openai>=1.0.0",
    "httpx>=0.24.0",
    "tenacity>=8.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0",
    "anthropic>=0.8.0",
    "google-generativeai>=0.3.0",
    "aiohttp>=3.8.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "langchain-community>=0.0.10",
    "chainlit>=1.0.0",
    "langgraph>=1.0.6",
    "langchain-core>=1.2.7",
    "tavily-python>=0.3.0",
    "fastmcp>=2.14.5",
    "docker>=7.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "json-repair>=0.58.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.31.0",
    "pandas>=2.3.3",
    "prometheus-client>=0.24.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "e2e: End-to-end tests for the web interface",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest-benchmark>=5.2.3",
    "pytest-playwright>=0.7.2",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []
