# 多提供商配置示例
# 适用于需要使用多个LLM提供商的场景

# 全局配置
global:
  default_provider: "openai"  # 默认使用OpenAI
  retry:
    max_attempts: 3
    initial_delay: 1.0
    max_delay: 8.0
    exponential_base: 2.0
  timeout:
    connect: 12.0
    read: 90.0
    total: 150.0
  logging:
    level: "INFO"
    format: "detailed"

# 提供商配置
providers:
  # OpenAI提供商 - 主要用于通用对话
  openai:
    enabled: true
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    organization: "${OPENAI_ORG_ID}"
    default_model: "gpt-3.5-turbo"
    models:
      gpt-3.5-turbo:
        max_tokens: 2000
        temperature: 0.7
        top_p: 0.9
        frequency_penalty: 0.0
        presence_penalty: 0.0
      gpt-4:
        max_tokens: 4000
        temperature: 0.5
        top_p: 0.8
        frequency_penalty: 0.1
        presence_penalty: 0.1
      gpt-4-turbo:
        max_tokens: 8000
        temperature: 0.3
        top_p: 0.7
        frequency_penalty: 0.2
        presence_penalty: 0.2
    timeout:
      connect: 12.0
      read: 90.0
      total: 150.0
    retry:
      max_attempts: 3
      initial_delay: 1.0
      max_delay: 8.0
      exponential_base: 2.0
    rate_limit:
      requests_per_minute: 1000
      tokens_per_minute: 150000

  # Anthropic提供商 - 用于复杂推理和分析
  anthropic:
    enabled: true
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "https://api.anthropic.com"
    default_model: "claude-3-sonnet-20240229"
    models:
      claude-3-haiku-20240307:
        max_tokens: 2000
        temperature: 0.7
        top_p: 0.9
        frequency_penalty: 0.0
        presence_penalty: 0.0
      claude-3-sonnet-20240229:
        max_tokens: 4000
        temperature: 0.5
        top_p: 0.8
        frequency_penalty: 0.1
        presence_penalty: 0.1
      claude-3-opus-20240229:
        max_tokens: 8000
        temperature: 0.3
        top_p: 0.7
        frequency_penalty: 0.2
        presence_penalty: 0.2
    timeout:
      connect: 15.0
      read: 120.0
      total: 180.0
    retry:
      max_attempts: 3
      initial_delay: 1.0
      max_delay: 10.0
      exponential_base: 2.0
    rate_limit:
      requests_per_minute: 500
      tokens_per_minute: 80000

  # Azure OpenAI提供商 - 企业级部署
  azure_openai:
    enabled: true
    api_key: "${AZURE_OPENAI_API_KEY}"
    azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_version: "2024-02-15-preview"
    default_model: "gpt-35-turbo"
    models:
      gpt-35-turbo:
        max_tokens: 2000
        temperature: 0.7
        top_p: 0.9
        frequency_penalty: 0.0
        presence_penalty: 0.0
        deployment_name: "gpt-35-turbo-deployment"
      gpt-4:
        max_tokens: 4000
        temperature: 0.5
        top_p: 0.8
        frequency_penalty: 0.1
        presence_penalty: 0.1
        deployment_name: "gpt-4-deployment"
    timeout:
      connect: 15.0
      read: 120.0
      total: 180.0
    retry:
      max_attempts: 3
      initial_delay: 1.0
      max_delay: 10.0
      exponential_base: 2.0
    rate_limit:
      requests_per_minute: 2000
      tokens_per_minute: 200000

  # Ollama提供商 - 本地部署的开源模型
  ollama:
    enabled: true
    api_key: "ollama-local"  # Ollama通常不需要API密钥
    base_url: "http://localhost:11434"
    default_model: "llama2"
    models:
      llama2:
        max_tokens: 2000
        temperature: 0.7
        top_p: 0.9
        frequency_penalty: 0.0
        presence_penalty: 0.0
      codellama:
        max_tokens: 4000
        temperature: 0.3
        top_p: 0.8
        frequency_penalty: 0.1
        presence_penalty: 0.1
      mistral:
        max_tokens: 3000
        temperature: 0.5
        top_p: 0.85
        frequency_penalty: 0.05
        presence_penalty: 0.05
    timeout:
      connect: 10.0
      read: 180.0  # 本地模型可能需要更长时间
      total: 300.0
    retry:
      max_attempts: 2
      initial_delay: 2.0
      max_delay: 10.0
      exponential_base: 2.0

  # Mock提供商 - 用于开发和测试
  mock:
    enabled: true
    api_key: "mock-key-multi"
    base_url: "http://localhost:8000"
    default_model: "mock-gpt-3.5-turbo"
    models:
      mock-gpt-3.5-turbo:
        max_tokens: 2000
        temperature: 0.7
        top_p: 0.9
        frequency_penalty: 0.0
        presence_penalty: 0.0
        response_delay: 0.5
      mock-gpt-4:
        max_tokens: 4000
        temperature: 0.5
        top_p: 0.8
        frequency_penalty: 0.1
        presence_penalty: 0.1
        response_delay: 1.0
      mock-claude-3:
        max_tokens: 3000
        temperature: 0.6
        top_p: 0.85
        frequency_penalty: 0.05
        presence_penalty: 0.05
        response_delay: 0.8
    timeout:
      connect: 5.0
      read: 30.0
      total: 60.0
    retry:
      max_attempts: 1
      initial_delay: 0.5
      max_delay: 1.0
      exponential_base: 1.0

# 环境特定配置
environments:
  multi_provider:
    debug: true
    log_requests: true
    log_responses: true
    validate_config: true
    cache_enabled: true

# 功能配置
features:
  streaming:
    enabled: true
    chunk_size: 1024
    timeout: 60.0
  
  context:
    max_history: 30
    max_tokens: 8000
    auto_truncate: true
  
  cache:
    enabled: true
    ttl: 1800  # 30分钟缓存
    max_size: 5000
  
  monitoring:
    enabled: true
    metrics_interval: 30
    log_performance: true
    track_usage: true
  
  security:
    validate_input: true
    sanitize_output: true
    rate_limiting: true
    api_key_rotation: false

# 提供商使用策略（可选配置）
strategies:
  # 负载均衡策略
  load_balancing:
    enabled: true
    providers: ["openai", "anthropic", "azure_openai"]
    weights:
      openai: 0.5
      anthropic: 0.3
      azure_openai: 0.2
  
  # 故障转移策略
  failover:
    enabled: true
    primary: "openai"
    fallback: ["anthropic", "azure_openai", "mock"]
    max_retries_per_provider: 2
  
  # 成本优化策略
  cost_optimization:
    enabled: true
    cheap_providers: ["mock", "ollama"]
    expensive_providers: ["gpt-4", "claude-3-opus-20240229"]
    cost_threshold: 100  # 每日成本阈值（美元）