# 开发环境配置示例
# 适用于本地开发和调试

# 全局配置
global:
  default_provider: "mock"  # 开发环境使用Mock提供商
  retry:
    max_attempts: 2  # 开发环境减少重试次数
    initial_delay: 0.5
    max_delay: 2.0
    exponential_base: 1.5
  timeout:
    connect: 10.0
    read: 30.0
    total: 60.0
  logging:
    level: "DEBUG"  # 开发环境启用详细日志
    format: "detailed"

# 提供商配置
providers:
  # Mock提供商 - 开发环境主要使用
  mock:
    enabled: true
    api_key: "mock-key-dev"
    base_url: "http://localhost:8000"
    default_model: "mock-gpt-3.5-turbo"
    models:
      mock-gpt-3.5-turbo:
        max_tokens: 1000
        temperature: 0.7
        top_p: 0.9
        frequency_penalty: 0.0
        presence_penalty: 0.0
        response_delay: 0.1  # 快速响应用于开发
      mock-gpt-4:
        max_tokens: 2000
        temperature: 0.5
        top_p: 0.8
        frequency_penalty: 0.1
        presence_penalty: 0.1
        response_delay: 0.2
    timeout:
      connect: 5.0
      read: 15.0
      total: 30.0
    retry:
      max_attempts: 1  # Mock提供商不需要重试
      initial_delay: 0.1
      max_delay: 0.5
      exponential_base: 1.0

  # OpenAI提供商 - 可选用于测试真实API
  openai:
    enabled: false  # 默认关闭，需要时手动启用
    api_key: "${OPENAI_API_KEY}"  # 从环境变量获取
    base_url: "https://api.openai.com/v1"
    organization: "${OPENAI_ORG_ID}"
    default_model: "gpt-3.5-turbo"
    models:
      gpt-3.5-turbo:
        max_tokens: 1000
        temperature: 0.7
        top_p: 0.9
        frequency_penalty: 0.0
        presence_penalty: 0.0
      gpt-4:
        max_tokens: 2000
        temperature: 0.5
        top_p: 0.8
        frequency_penalty: 0.1
        presence_penalty: 0.1
    timeout:
      connect: 10.0
      read: 60.0
      total: 120.0
    retry:
      max_attempts: 2
      initial_delay: 1.0
      max_delay: 5.0
      exponential_base: 2.0
    rate_limit:
      requests_per_minute: 60
      tokens_per_minute: 40000

# 环境特定配置
environments:
  development:
    debug: true
    log_requests: true
    log_responses: true
    validate_config: true
    cache_enabled: false  # 开发环境禁用缓存

# 功能配置
features:
  streaming:
    enabled: true
    chunk_size: 1024
    timeout: 30.0
  
  context:
    max_history: 10  # 开发环境限制历史记录
    max_tokens: 4000
    auto_truncate: true
  
  cache:
    enabled: false  # 开发环境禁用缓存
    ttl: 300
    max_size: 100
  
  monitoring:
    enabled: true
    metrics_interval: 10
    log_performance: true
    track_usage: true
  
  security:
    validate_input: true
    sanitize_output: true
    rate_limiting: false  # 开发环境禁用限流
    api_key_rotation: false