# 测试环境配置示例
# 适用于自动化测试和CI/CD流水线

# 全局配置
global:
  default_provider: "openai"  # 测试环境使用OpenAI
  retry:
    max_attempts: 1  # 测试环境不重试，快速失败
    initial_delay: 0.1
    max_delay: 0.5
    exponential_base: 1.0
  timeout:
    connect: 5.0
    read: 10.0
    total: 20.0
  logging:
    level: "WARNING"  # 测试环境减少日志输出
    format: "simple"

# 提供商配置
providers:
  # Mock提供商 - 已移除
  # mock: ...
  
  # OpenAI提供商
  openai:
    enabled: true
    api_key: "${OPENAI_API_KEY}"
    default_model: "gpt-3.5-turbo"
    models:
      gpt-3.5-turbo:
        max_tokens: 500  # 测试环境限制token数量
        temperature: 0.0  # 测试环境使用确定性输出
        top_p: 1.0
        frequency_penalty: 0.0
        presence_penalty: 0.0
    timeout:
      connect: 5.0
      read: 15.0
      total: 30.0
    retry:
      max_attempts: 1  # 测试环境不重试
      initial_delay: 0.5
      max_delay: 1.0
      exponential_base: 1.0
    rate_limit:
      requests_per_minute: 10  # 测试环境限制请求频率
      tokens_per_minute: 1000

# 环境特定配置
environments:
  testing:
    debug: false
    log_requests: false  # 测试环境不记录详细日志
    log_responses: false
    validate_config: true
    cache_enabled: false  # 测试环境禁用缓存，确保测试独立性

# 功能配置
features:
  streaming:
    enabled: false  # 测试环境禁用流式传输，简化测试
    chunk_size: 512
    timeout: 10.0
  
  context:
    max_history: 5  # 测试环境限制历史记录
    max_tokens: 1000
    auto_truncate: true
  
  cache:
    enabled: false  # 测试环境禁用缓存
    ttl: 60
    max_size: 10
  
  monitoring:
    enabled: false  # 测试环境禁用监控
    metrics_interval: 5
    log_performance: false
    track_usage: false
  
  security:
    validate_input: true
    sanitize_output: true
    rate_limiting: false  # 测试环境禁用限流
    api_key_rotation: false