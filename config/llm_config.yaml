# LLM提供商配置文件
# 支持多个LLM提供商的配置和动态切换

# 全局配置
global:
  # 默认使用的LLM提供商
  default_provider: "nvidia_nim"
  
  # 全局重试配置
  retry:
    max_attempts: 3
    initial_delay: 1.0
    max_delay: 60.0
    exponential_base: 2.0
  
  # 全局超时配置（秒）
  timeout:
    connect: 30.0
    read: 120.0
    total: 180.0
  
  # 日志级别
  log_level: "INFO"

# LLM提供商配置
providers:
  # OpenAI配置
  nvidia_nim:
    # 显式指定使用 OpenAI 客户端兼容模式
    type: "openai"
    enabled: true
    api_key: "${NVIDIA_API_KEY}"
    base_url: "https://integrate.api.nvidia.com/v1"
    default_model: "moonshotai/kimi-k2-thinking"
    models:
      meta/llama-3.1-70b-instruct:
        max_tokens: 4096
        temperature: 0.7
      meta/llama-3.1-405b-instruct:
        max_tokens: 4096
        temperature: 0.7
      deepseek-ai/deepseek-v3.1:
        max_tokens: 4096
        temperature: 0.7
      moonshotai/kimi-k2-thinking:
        max_tokens: 4096
        temperature: 0.7
      qwen/qwen3-next-80b-a3b-thinking:
        max_tokens: 4096
        temperature: 0.7
      qwen/qwq-32b:
        max_tokens: 4096
        temperature: 0.7



  # OpenAI配置
  openai:
    # 是否启用
    enabled: true
    
    # API配置
    api_key: "${OPENAI_API_KEY}"  # 支持环境变量
    base_url: "https://api.openai.com/v1"  # 可选，自定义API端点
    organization: "${OPENAI_ORG_ID}"  # 可选，组织ID
    
    # 默认模型配置
    default_model: "gpt-4"
    
    # 模型配置
    models:
      gpt-4:
        max_tokens: 4096
        temperature: 0.7
        top_p: 1.0
        frequency_penalty: 0.0
        presence_penalty: 0.0
        
      gpt-4-turbo:
        max_tokens: 4096
        temperature: 0.7
        top_p: 1.0
        frequency_penalty: 0.0
        presence_penalty: 0.0
        
      gpt-3.5-turbo:
        max_tokens: 4096
        temperature: 0.7
        top_p: 1.0
        frequency_penalty: 0.0
        presence_penalty: 0.0
    
    # 提供商特定的重试配置（覆盖全局配置）
    retry:
      max_attempts: 5
      initial_delay: 0.5
      max_delay: 30.0
    
    # 速率限制配置
    rate_limit:
      requests_per_minute: 60
      tokens_per_minute: 90000

  # Anthropic配置
  anthropic:
    enabled: false  # 默认禁用
    
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "https://api.anthropic.com"
    
    default_model: "claude-3-sonnet-20240229"
    
    models:
      claude-3-opus-20240229:
        max_tokens: 4096
        temperature: 0.7
        top_p: 1.0
        
      claude-3-sonnet-20240229:
        max_tokens: 4096
        temperature: 0.7
        top_p: 1.0
        
      claude-3-haiku-20240307:
        max_tokens: 4096
        temperature: 0.7
        top_p: 1.0
    
    retry:
      max_attempts: 3
      initial_delay: 1.0
      max_delay: 60.0

  # Azure OpenAI配置
  azure_openai:
    enabled: false
    
    api_key: "${AZURE_OPENAI_API_KEY}"
    azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_version: "2024-02-15-preview"
    
    default_model: "gpt-4"
    
    models:
      gpt-4:
        deployment_name: "gpt-4-deployment"  # Azure部署名称
        max_tokens: 4096
        temperature: 0.7
        
      gpt-35-turbo:
        deployment_name: "gpt-35-turbo-deployment"
        max_tokens: 4096
        temperature: 0.7

  # Ollama本地配置
  ollama:
    enabled: false
    
    base_url: "http://localhost:11434"
    
    default_model: "llama2"
    
    models:
      llama2:
        max_tokens: 2048
        temperature: 0.7
        
      codellama:
        max_tokens: 4096
        temperature: 0.3
        
      mistral:
        max_tokens: 4096
        temperature: 0.7
    
    timeout:
      connect: 10.0
      read: 300.0   # 本地模型可能需要更长时间
      total: 600.0  # 总超时应大于 read_timeout

# 环境特定配置
environments:
  development:
    global:
      default_provider: "openai"
      log_level: "DEBUG"
    providers:
      openai:
        enabled: true
      
  testing:
    global:
      default_provider: "openai"
      log_level: "DEBUG"
    providers:
      openai:
        enabled: true
      
  production:
    global:
      default_provider: "nvidia_nim"
      log_level: "INFO"
    providers:
      nvidia_nim:
        enabled: true
      openai:
        enabled: true

# 功能特性配置
features:
  # 流式响应
  streaming:
    enabled: true
    chunk_size: 1024
    
  # 对话上下文管理
  context:
    max_history: 10
    max_tokens: 8192
    
  # 缓存配置
  cache:
    enabled: true
    ttl: 3600  # 缓存时间（秒）
    max_size: 1000  # 最大缓存条目数
    
  # 监控和指标
  monitoring:
    enabled: true
    metrics_interval: 60  # 指标收集间隔（秒）
    
  # 安全配置
  security:
    input_validation: true
    output_filtering: true
    max_input_length: 10000